[project]
name = "omenu"
version = "0.1.0"
description = "A GTA-inspired radial menu application launcher for Wayland-based Linux systems"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "evdev>=2.0.0",
    "pycairo>=1.29.1",
    "pygobject>=3.58.0",
]

[project.scripts]
omenu = "omenu.__main__:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.pyright]
reportAttributeAccessIssue = "none"